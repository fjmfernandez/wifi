# PostgreSQL interface owned by the product migration. The disposable lab
# implementation lives in infra/freeradius/lab/sql/001-radius-runtime.sql.

sql_user_name = "%{User-Name}"
auto_escape = yes

authorize_check_query = "\
    SELECT id, username, attribute, value, op \
    FROM radius_runtime.radcheck_compat \
    WHERE username = '%{SQL-User-Name}' \
      AND nas_identifier = '%{NAS-Identifier}' \
      AND (calling_station_id IS NULL OR calling_station_id = LOWER(REGEXP_REPLACE('%{Calling-Station-Id}', '[^0-9A-Fa-f]', '', 'g'))) \
      AND enabled \
      AND not_before <= clock_timestamp() \
      AND expires_at > clock_timestamp() \
    ORDER BY id"

authorize_reply_query = "\
    SELECT id, username, attribute, value, op \
    FROM radius_runtime.radreply_compat \
    WHERE username = '%{SQL-User-Name}' \
      AND nas_identifier = '%{NAS-Identifier}' \
      AND (calling_station_id IS NULL OR calling_station_id = LOWER(REGEXP_REPLACE('%{Calling-Station-Id}', '[^0-9A-Fa-f]', '', 'g'))) \
      AND enabled \
      AND not_before <= clock_timestamp() \
      AND expires_at > clock_timestamp() \
      AND attribute IN ('Class', 'Mikrotik-Rate-Limit', 'Session-Timeout', 'Idle-Timeout', 'Acct-Interim-Interval', 'Port-Limit') \
    ORDER BY priority, id"

# Deliberately absent: group queries and Simultaneous-Use. Server-side
# concurrency needs the normalized session projection from PR10. RouterOS gets
# Port-Limit from radreply_compat instead.

accounting {
    reference = "%{tolower:type.%{%{Acct-Status-Type}:-unknown}.query}"

    type {
        start {
            query = "\
                WITH resolved AS ( \
                    SELECT \
                        c.tenant_id, \
                        c.gateway_id, \
                        c.authorization_id, \
                        c.username, \
                        c.nas_identifier, \
                        NULLIF('%{Acct-Session-Id}', '') AS acct_session_id, \
                        '%{Acct-Status-Type}' AS status_type, \
                        NULLIF('%{%{integer:Event-Timestamp}:-0}', '0')::bigint AS nas_event_epoch, \
                        NULLIF('%{%{Acct-Session-Time}:-}', '')::bigint AS session_time_seconds, \
                        ('%{%{Acct-Input-Gigawords}:-0}'::numeric * 4294967296 + '%{%{Acct-Input-Octets}:-0}'::numeric) AS nas_input_octets, \
                        ('%{%{Acct-Output-Gigawords}:-0}'::numeric * 4294967296 + '%{%{Acct-Output-Octets}:-0}'::numeric) AS nas_output_octets \
                    FROM radius_runtime.credentials c \
                    WHERE c.username = '%{SQL-User-Name}' \
                      AND c.nas_identifier = '%{NAS-Identifier}' \
                    LIMIT 1 \
                ), event AS ( \
                    SELECT \
                        resolved.*, \
                        encode(sha256(convert_to(concat_ws(chr(31), \
                            'radius-accounting-v1', tenant_id::text, gateway_id::text, \
                            nas_identifier, acct_session_id, status_type, \
                            COALESCE(nas_event_epoch::text, ''), \
                            COALESCE(session_time_seconds::text, ''), \
                            nas_input_octets::text, nas_output_octets::text \
                        ), 'UTF8')), 'hex') AS event_fingerprint \
                    FROM resolved \
                ) \
                INSERT INTO radius_runtime.accounting_inbox ( \
                    tenant_id, gateway_id, authorization_id, username, nas_identifier, \
                    packet_source_ip, nas_ip_address, acct_session_id, status_type, \
                    nas_event_at, session_time_seconds, nas_input_octets, nas_output_octets, \
                    acct_delay_seconds, calling_station_id, framed_ip_address, class_value, \
                    terminate_cause, redacted_payload, event_fingerprint \
                ) \
                SELECT \
                    event.tenant_id, event.gateway_id, event.authorization_id, event.username, event.nas_identifier, \
                    NULLIF('%{%{Packet-Src-IP-Address}:-%{Packet-Src-IPv6-Address}}', '')::inet, \
                    NULLIF('%{%{NAS-IP-Address}:-%{%{NAS-IPv6-Address}:-%{Packet-Src-IP-Address}}}', '')::inet, \
                    event.acct_session_id, event.status_type, \
                    CASE WHEN event.nas_event_epoch IS NULL THEN NULL ELSE to_timestamp(event.nas_event_epoch) END, \
                    event.session_time_seconds, event.nas_input_octets, event.nas_output_octets, \
                    COALESCE(NULLIF('%{Acct-Delay-Time}', '')::integer, 0), \
                    NULLIF('%{Calling-Station-Id}', ''), \
                    NULLIF('%{Framed-IP-Address}', '')::inet, \
                    NULLIF('%{string:&Class}', ''), NULLIF('%{Acct-Terminate-Cause}', ''), \
                    jsonb_strip_nulls(jsonb_build_object( \
                        'calledStationId', NULLIF('%{Called-Station-Id}', ''), \
                        'callingStationId', NULLIF('%{Calling-Station-Id}', ''), \
                        'framedIpAddress', NULLIF('%{Framed-IP-Address}', ''), \
                        'nasPort', NULLIF('%{NAS-Port}', ''), \
                        'serviceType', NULLIF('%{Service-Type}', '') \
                    )), \
                    event.event_fingerprint \
                FROM event \
                ON CONFLICT (tenant_id, event_fingerprint) DO NOTHING"
        }

        interim-update {
            query = "${..start.query}"
        }

        stop {
            query = "${..start.query}"
        }
    }
}

post-auth {
    query = "\
        INSERT INTO radius_runtime.post_auth_inbox ( \
            tenant_id, gateway_id, authorization_id, username, nas_identifier, \
            packet_source_ip, calling_station_id, reply_packet_type, class_value \
        ) \
        SELECT \
            c.tenant_id, c.gateway_id, c.authorization_id, c.username, c.nas_identifier, \
            NULLIF('%{%{Packet-Src-IP-Address}:-%{Packet-Src-IPv6-Address}}', '')::inet, \
            NULLIF('%{Calling-Station-Id}', ''), '%{reply:Packet-Type}', NULLIF('%{string:&reply:Class}', '') \
        FROM radius_runtime.credentials c \
        WHERE c.username = '%{SQL-User-Name}' \
          AND c.nas_identifier = '%{NAS-Identifier}' \
        LIMIT 1"
}
