name: wifi-entelsat

services:
  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-development}
        INTERNAL_API_URL: http://api:3001
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:3001
      NEXT_PUBLIC_DEMO_MODE: "false"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  captive:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.captive
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-development}
        INTERNAL_API_URL: http://api:3001
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:3001
      NEXT_PUBLIC_DEMO_MODE: "false"
    expose:
      - "3002"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      BUILD_SHA: ${SOURCE_COMMIT:?SOURCE_COMMIT is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://wifi_api:${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD is required}@postgres:5432/wifi_entelsat
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CORS_ORIGINS: https://wifi.entelsat.com,https://captive.wifi.entelsat.com
      TRUST_PROXY: "true"
      SWAGGER_ENABLED: "false"
      DEMO_MODE: "false"
      CAPTIVE_PUBLIC_ORIGIN: https://captive.wifi.entelsat.com
      CAPTIVE_STATE_HMAC_KEY_BASE64: ${CAPTIVE_STATE_HMAC_KEY_BASE64:?CAPTIVE_STATE_HMAC_KEY_BASE64 is required}
      CAPTIVE_IDENTIFIER_HMAC_KEY_BASE64: ${CAPTIVE_IDENTIFIER_HMAC_KEY_BASE64:?CAPTIVE_IDENTIFIER_HMAC_KEY_BASE64 is required}
      ADMIN_PUBLIC_ORIGIN: https://wifi.entelsat.com
      ADMIN_EMAIL_HMAC_KEY_BASE64: ${ADMIN_EMAIL_HMAC_KEY_BASE64:?ADMIN_EMAIL_HMAC_KEY_BASE64 is required}
      ADMIN_SESSION_HMAC_KEY_BASE64: ${ADMIN_SESSION_HMAC_KEY_BASE64:?ADMIN_SESSION_HMAC_KEY_BASE64 is required}
      DATA_ENCRYPTION_MASTER_KEY_BASE64: ${DATA_ENCRYPTION_MASTER_KEY_BASE64:?DATA_ENCRYPTION_MASTER_KEY_BASE64 is required}
      VOUCHER_HMAC_MASTER_KEY_BASE64: ${VOUCHER_HMAC_MASTER_KEY_BASE64:?VOUCHER_HMAC_MASTER_KEY_BASE64 is required}
      ADMIN_REQUIRE_MFA: "true"
      RADIUS_CREDENTIAL_MODE: ${RADIUS_CREDENTIAL_MODE:-blocked}
    expose:
      - "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BUILD_SHA: ${SOURCE_COMMIT:?SOURCE_COMMIT is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://wifi_jobs:${POSTGRES_WORKER_PASSWORD:?POSTGRES_WORKER_PASSWORD is required}@postgres:5432/wifi_entelsat
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      WORKER_REQUIRED_QUEUES: accounting
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: "3003"
    expose:
      - "3003"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.migrate
    restart: "no"
    # Coolify-specific: this one-shot container must not determine stack health.
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgresql://wifi_bootstrap:${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD is required}@postgres:5432/wifi_entelsat
      WIFI_API_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD is required}
      WIFI_JOBS_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?POSTGRES_WORKER_PASSWORD is required}
      WIFI_RADIUS_PASSWORD: ${POSTGRES_RADIUS_PASSWORD:?POSTGRES_RADIUS_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: wifi_entelsat
      POSTGRES_USER: wifi_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifi_bootstrap -d wifi_entelsat"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

volumes:
  postgres_data:
  redis_data:
