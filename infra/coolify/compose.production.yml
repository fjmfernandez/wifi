name: wifi-entelsat

services:
  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-development}
        INTERNAL_API_URL: http://api:3001
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:3001
      NEXT_PUBLIC_DEMO_MODE: "false"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  captive:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.captive
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-development}
        INTERNAL_API_URL: http://api:3001
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:3001
      NEXT_PUBLIC_DEMO_MODE: "false"
      PORT: "3002"
      HOSTNAME: 0.0.0.0
    expose:
      - "3002"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      BUILD_SHA: ${SOURCE_COMMIT:?SOURCE_COMMIT is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://wifi_api:${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD is required}@postgres:5432/wifi_entelsat
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CORS_ORIGINS: https://panel.wpass.es,https://captive.wpass.es
      TRUST_PROXY: "true"
      SWAGGER_ENABLED: "false"
      DEMO_MODE: "false"
      CAPTIVE_PUBLIC_ORIGIN: https://captive.wpass.es
      CAPTIVE_STATE_HMAC_KEY_BASE64: ${CAPTIVE_STATE_HMAC_KEY_BASE64:-}
      CAPTIVE_IDENTIFIER_HMAC_KEY_BASE64: ${CAPTIVE_IDENTIFIER_HMAC_KEY_BASE64:-}
      ADMIN_PUBLIC_ORIGIN: https://panel.wpass.es
      ADMIN_EMAIL_HMAC_KEY_BASE64: ${ADMIN_EMAIL_HMAC_KEY_BASE64:-}
      ADMIN_SESSION_HMAC_KEY_BASE64: ${ADMIN_SESSION_HMAC_KEY_BASE64:-}
      DATA_ENCRYPTION_MASTER_KEY_BASE64: ${DATA_ENCRYPTION_MASTER_KEY_BASE64:-}
      VOUCHER_HMAC_MASTER_KEY_BASE64: ${VOUCHER_HMAC_MASTER_KEY_BASE64:-}
      ADMIN_REQUIRE_MFA: "true"
      RADIUS_CREDENTIAL_MODE: ${RADIUS_CREDENTIAL_MODE:-blocked}
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BUILD_SHA: ${SOURCE_COMMIT:?SOURCE_COMMIT is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://wifi_jobs:${POSTGRES_WORKER_PASSWORD:?POSTGRES_WORKER_PASSWORD is required}@postgres:5432/wifi_entelsat
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      WORKER_REQUIRED_QUEUES: accounting
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: "3003"
    expose:
      - "3003"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  radius:
    build:
      context: infra/freeradius
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RADIUS_DB_HOST: postgres
      RADIUS_DB_PORT: "5432"
      RADIUS_DB_NAME: wifi_entelsat
      RADIUS_DB_USER: wifi_radius
      RADIUS_DB_PASSWORD: ${POSTGRES_RADIUS_PASSWORD:?POSTGRES_RADIUS_PASSWORD is required}
      RADIUS_DB_SSLMODE: disable
      RADIUS_ALLOW_INSECURE_DB: lab-only
      RADIUS_CLIENTS_TSV: ${RADIUS_CLIENTS_TSV:-local-disabled	127.0.0.1	LOCAL_ONLY_PLACEHOLDER_SECRET_123456}
      RADIUS_TRUSTED_PROXY_CIDRS: ${RADIUS_TRUSTED_PROXY_CIDRS:-10.0.3.0/24}
    expose:
      - "1812/udp"
      - "1813/udp"
    volumes:
      - radius_radacct:/var/log/freeradius/radacct
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  sstp-vpn:
    build:
      context: infra/sstp-vpn
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SSTP_PUBLIC_HOST: ${SSTP_PUBLIC_HOST:-62.84.190.174}
      SSTP_PORT: ${SSTP_PORT:-4443}
      SSTP_LOCAL_IP: ${SSTP_LOCAL_IP:-10.255.0.1}
      SSTP_POOL: ${SSTP_POOL:-10.255.0.2-254}
      SSTP_CLIENT_IP_RANGE: ${SSTP_CLIENT_IP_RANGE:-0.0.0.0/0}
      SSTP_DNS1: ${SSTP_DNS1:-1.1.1.1}
      SSTP_DNS2: ${SSTP_DNS2:-8.8.8.8}
      SSTP_USERS_TSV: ${SSTP_USERS_TSV:-}
      SSTP_CERT_PEM_BASE64: ${SSTP_CERT_PEM_BASE64:-}
      SSTP_KEY_PEM_BASE64: ${SSTP_KEY_PEM_BASE64:-}
      RADIUS_HOST: radius
    ports:
      - "${SSTP_PORT:-4443}:4443/tcp"
    privileged: true
    cap_add:
      - NET_ADMIN
    depends_on:
      radius:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrate
    restart: "no"
    # Coolify-specific: this one-shot container must not determine stack health.
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgresql://wifi_bootstrap:${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD is required}@postgres:5432/wifi_entelsat
      WIFI_API_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD is required}
      WIFI_JOBS_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?POSTGRES_WORKER_PASSWORD is required}
      WIFI_RADIUS_PASSWORD: ${POSTGRES_RADIUS_PASSWORD:?POSTGRES_RADIUS_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: wifi_entelsat
      POSTGRES_USER: wifi_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifi_bootstrap -d wifi_entelsat"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

volumes:
  postgres_data:
  redis_data:
  radius_radacct:
