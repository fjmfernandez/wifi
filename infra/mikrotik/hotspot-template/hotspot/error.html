<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error WiFi</title>
  <style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7ed;color:#0f172a}.card{width:min(380px,calc(100vw - 32px));border:1px solid #fed7aa;border-radius:28px;background:#fff;padding:26px;text-align:center;box-shadow:0 24px 70px rgba(15,23,42,.10)}a{color:#c2410c;font-weight:900}</style>
</head>
<body>
  <main class="card">
    <h1>No se pudo iniciar sesión</h1>
    <p>$(error)</p>
    <p><a href="$(link-login)">Intentarlo de nuevo</a></p>
  </main>
</body>
</html>
