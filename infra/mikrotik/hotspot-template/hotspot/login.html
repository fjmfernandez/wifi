<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>WiFi · __CLIENT_NAME__</title>
  <style>
    :root {
      --brand: __PRIMARY_COLOR__;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --soft: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 16% 10%, rgba(13, 148, 136, .18), transparent 32%),
        radial-gradient(circle at 86% 6%, rgba(15, 23, 42, .12), transparent 28%),
        linear-gradient(180deg, #fff, var(--soft));
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(390px, calc(100vw - 32px));
      overflow: hidden;
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: 32px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 28px 90px rgba(15, 23, 42, .14);
      backdrop-filter: blur(20px);
    }

    .hero {
      padding: 28px 24px 22px;
      text-align: center;
      background:
        linear-gradient(135deg, var(--brand), #0f172a);
      color: white;
    }

    .logo {
      display: grid;
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      place-items: center;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, .55);
      background: white;
      box-shadow: 0 18px 42px rgba(15, 23, 42, .22);
    }

    .logo img {
      max-width: 66px;
      max-height: 66px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .hero p {
      margin: 10px auto 0;
      max-width: 280px;
      color: rgba(255, 255, 255, .82);
      font-size: 14px;
      line-height: 1.45;
    }

    .content {
      padding: 24px;
      text-align: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--brand);
      box-shadow: 0 0 0 6px rgba(13, 148, 136, .14);
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 18px;
      border: 0;
      border-radius: 18px;
      background: var(--brand);
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 16px 34px rgba(13, 148, 136, .28);
    }

    .small {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <span class="logo">
        <img src="img/logo.svg" alt="__CLIENT_NAME__">
      </span>
      <h1>WiFi de __CLIENT_NAME__</h1>
      <p>__TAGLINE__</p>
    </section>

    <section class="content">
      <span class="status"><span class="dot"></span> Portal seguro gestionado por WPass</span>
      <form id="wpass-captive" action="https://captive.wpass.es/api/v1/captive/session/start" method="post">
        <input type="hidden" name="gatewayLocator" value="__GATEWAY_LOCATOR__">
        <input type="hidden" name="mac" value="$(mac)">
        <input type="hidden" name="macEsc" value="$(mac-esc)">
        <input type="hidden" name="ip" value="$(ip)">
        <input type="hidden" name="linkLogin" value="$(link-login)">
        <input type="hidden" name="linkOrig" value="$(link-orig)">
        <input type="hidden" name="error" value="$(error)">
        <input type="hidden" name="chapId" value="$(chap-id)">
        <input type="hidden" name="chapChallenge" value="$(chap-challenge)">
        <input type="hidden" name="linkLoginOnly" value="$(link-login-only)">
        <input type="hidden" name="linkOrigEsc" value="$(link-orig-esc)">
        <button type="submit">Abrir acceso WiFi</button>
      </form>
      <p class="small">Si no se abre automáticamente, pulsa el botón.</p>
    </section>
  </main>
  <script>
    window.setTimeout(function () {
      document.getElementById("wpass-captive").submit();
    }, 120);
  </script>
</body>
</html>
